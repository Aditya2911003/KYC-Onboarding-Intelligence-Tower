[project]
name = "kyc-onboarding-control-tower"
version = "1.0.0"
description = "Interactive KYC onboarding and control-assurance dashboard: SQL warehouse (DuckDB), rule-engine reconciliation, simulated SLA analytics, Streamlit UI."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AUTHOR_NAME" }]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "notebooks", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "D"]
ignore = [
    "D203", "D213",   # conflicting docstring layout rules
    "D100", "D104",   # module/package docstrings are optional
    "D105", "D107", "D413",
    "N999",           # page modules are numbered for navigation order (01_executive.py)
    "RUF001", "RUF002", "RUF003",  # typographic characters (×, →, —) are intentional in UI text
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"app/views/*" = ["D", "SIM117"]  # nested `with column:` / `with tile:` mirrors the page layout

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*ScriptRunContext.*",
]
